<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Link enviado · Acompanhamento CERNE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>body{background:#0d6efd10;} .box{max-width:380px;margin:8vh auto;}</style>
</head>
<body>
  <div class="box">
    <div class="text-center mb-3">
      <i class="bi bi-envelope-check text-success" style="font-size:2.5rem;"></i>
      <h4 class="mt-2">Verifique seu e-mail</h4>
    </div>
    <div class="card shadow-sm">
      <div class="card-body">
        <p class="small text-muted mb-3">
          Se existir uma conta com o e-mail informado, enviamos um link para redefinir a senha.
          Verifique a caixa de entrada (e o spam).
        </p>
        <a href="{% url 'login' %}" class="btn btn-outline-primary w-100"><i class="bi bi-arrow-left"></i> Voltar para o login</a>
      </div>
    </div>
    <div class="text-center text-muted small mt-3">Uso interno · Sistema de Acompanhamento CERNE 2025</div>
  </div>
</body>
</html>
