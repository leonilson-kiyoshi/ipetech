<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar senha · Acompanhamento CERNE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>body{background:#0d6efd10;} .box{max-width:380px;margin:8vh auto;}</style>
</head>
<body>
  <div class="box">
    <div class="text-center mb-3">
      <i class="bi bi-key text-primary" style="font-size:2.5rem;"></i>
      <h4 class="mt-2">Recuperar senha</h4>
      <div class="text-muted small">Informe seu e-mail para receber o link de redefinição</div>
    </div>
    <div class="card shadow-sm">
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">E-mail</label>
            <input type="email" name="email" class="form-control" autofocus required>
          </div>
          <button type="submit" class="btn btn-primary w-100"><i class="bi bi-envelope"></i> Enviar link</button>
        </form>
        <div class="text-center mt-3">
          <a href="{% url 'login' %}" class="small text-decoration-none"><i class="bi bi-arrow-left"></i> Voltar para o login</a>
        </div>
      </div>
    </div>
    <div class="text-center text-muted small mt-3">Uso interno · Sistema de Acompanhamento CERNE 2025</div>
  </div>
</body>
</html>
